name: Agregador de noticias

on:
  schedule:
    # Cada 8 horas (00:00, 08:00, 16:00 UTC). 3 runs/día — el redactor (Claude)
    # corre 3x mientras el "cerebro" (Analytics+Orquestador, cron aparte) piensa
    # cada hora sin costo. 2026-06-30: subimos de 2x a 3x según decisión del owner.
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias Python
        run: pip install -r scripts/requirements.txt

      - name: Instalar dependencias Node
        run: npm ci

      - name: Analytics + Orquestador
        # "Cerebro" de la flota: Analytics lee Search Console + GA4 (best-effort,
        # degrada sin credenciales) y el Orquestador emite daily-plan.json con
        # cuotas por categoría y keywords prioritarias que dirigen al agregador.
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: sc-domain:automatizacionslatam.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/analytics.py --verbose || echo "::warning::Analytics degradado, sigo."
          python scripts/orchestrator.py --verbose
          { echo "## Plan del día"; echo; cat scripts/state/daily-report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Correr agregador
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://automatizacionslatam.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/aggregator.py --verbose

      - name: Commit y push de nuevas noticias
        run: |
          git config user.name "automatizacion-latam-bot"
          git config user.email "bot@automatizacionslatam.com"
          git add src/content/noticias/ scripts/state/processed.json scripts/state/daily-plan.json scripts/state/analytics-report.json scripts/state/daily-report.md
          if git diff --staged --quiet; then
            echo "Sin cambios — nada que commitear."
          else
            COUNT=$(git diff --staged --name-only -- 'src/content/noticias/*.md' | wc -l)
            # Cuando el agregador no encuentra nada publicable igual hay que
            # commitear processed.json (si no, la proxima corrida reprocesa los
            # mismos items y gasta tokens). Pero el mensaje debe decir la verdad:
            # 42 de los ultimos 113 commits decian "publicar 0 noticia(s)", lo que
            # hacia ilegible el historial.
            if [ "$COUNT" -eq 0 ]; then
              MSG="auto: estado del agregador (sin noticias nuevas)"
            else
              MSG="auto: publicar $COUNT noticia(s)"
            fi
            git commit -m "$MSG"
            git push
          fi

      - name: Build sitio estático
        run: npm run build
        env:
          SITE_URL: https://automatizacionslatam.com
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_VERIFICATION: ${{ secrets.PUBLIC_BING_VERIFICATION }}
          PUBLIC_YANDEX_VERIFICATION: ${{ secrets.PUBLIC_YANDEX_VERIFICATION }}

      - name: Validar que PUBLIC_ADSENSE_CLIENT este presente en dist/index.html antes de deploy
        # Falla ruidosamente si el build no produjo AdSense en el HTML. Evita
        # que un secret mal configurado en CI sobreescriba produccion sin AdSense.
        run: |
          if ! grep -q "ca-pub-" dist/index.html; then
            echo "::error::dist/index.html NO contiene ca-pub-. El build se hizo sin PUBLIC_ADSENSE_CLIENT. Abortando deploy para no romper monetizacion."
            echo "Verifica que el secret PUBLIC_ADSENSE_CLIENT este definido y tenga el valor 'ca-pub-XXXXXXXXXXXXXXXX'."
            exit 1
          fi
          echo "::notice::AdSense (ca-pub-) confirmado en dist/index.html — listo para deploy."

      - name: Validar que ninguna pagina noindex sirva anuncios
        # La revision de AdSense evalua las paginas DONDE SE MUESTRAN ANUNCIOS,
        # no el indice de Busqueda. Servir anuncios en paginas que el propio
        # sitio marca noindex es la contradiccion que sostiene el veredicto de
        # "contenido de poco valor": llegamos a tener 640 de 687 asi. La regla
        # vive en src/components/AdSlot.astro (prop `indexable`); este guard
        # impide reintroducirla por descuido.
        run: |
          grep -rl 'class="adsbygoogle' dist --include=index.html | sort > /tmp/con-ads.txt
          grep -rl 'content="noindex' dist --include=index.html | sort > /tmp/noindex.txt
          FUGAS=$(comm -12 /tmp/con-ads.txt /tmp/noindex.txt)
          N=$(echo -n "$FUGAS" | grep -c . || true)
          if [ "$N" -gt 0 ]; then
            echo "::error::$N pagina(s) noindex sirven anuncios. Pasa indexable={false} al AdSlot correspondiente."
            echo "$FUGAS" | head -20
            exit 1
          fi
          TOTAL=$(grep -c . /tmp/con-ads.txt || true)
          echo "::notice::Inventario publicitario limpio: $TOTAL pagina(s) con anuncios, todas indexables."

      - name: Deploy a Cloudflare Workers
        id: cf_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Wrangler 4 soporta deploys con solo "assets" (sitios estaticos
          # puros). La v3 que la action instala por defecto exige un main
          # worker y falla con "Missing entry-point".
          wranglerVersion: "4"

      # NOTA (2026-09-01): aqui vivian dos steps, "Capturar version ID del
      # deploy del CI" y "Defensa anti deploy fantasma — rollback automatico",
      # que vigilaban 5 minutos por si la integracion Git de Cloudflare pisaba
      # el deploy del CI. Se eliminaron porque esa integracion NO EXISTE.
      # Comprobado contra la API de Cloudflare:
      #   - /accounts/<id>/pages/projects                        -> []
      #   - /accounts/<id>/builds/workers/<name>/triggers         -> []
      #   - las 8 ultimas versions y deployments del Worker son todas
      #     `source: "wrangler"`, ninguna de origen Git.
      #
      # El guard era un falso positivo que se disparaba en cada run: hacia
      # rollbacks reales e innecesarios (que a su vez crean versiones nuevas) y
      # gastaba 5 minutos de CI. En el run 33511051372 dejo activa la version
      # de las 13:04:56 en vez de la ultima del CI (13:05:24): el propio guard
      # revertia el deploy legitimo.
      #
      # La defensa que si sirve es el healthcheck de abajo, que comprueba
      # contra produccion que la version activa sirve AdSense y el canonical
      # correcto. Si algun dia se conecta una integracion Git, lo detectara.

      - name: Healthcheck post-deploy — verificar AdSense en produccion
        # Comprueba contra produccion que la version activa sirve AdSense y el
        # canonical del dominio real. Es la unica defensa necesaria: valida el
        # resultado observable en vez de vigilar quien hizo el deploy.
        run: |
          WORKER_URL="https://automatizacion-latam-web.jesusdavidquinterofontalvo.workers.dev"
          PUBLIC_URL="https://automatizacionslatam.com"
          UA="AdsBot-Google (+http://www.google.com/adsbot.html)"

          for attempt in 1 2 3 4 5; do
            echo "Intento $attempt sobre Worker URL directo..."
            # Cache-bust con un path inexistente seguido del path real fuerza
            # MISS porque CF cachea per-URL. Pero CF tambien respeta el header
            # CF-Cache-Bypass, asi que combinamos ambos.
            HTML=$(curl -s -A "$UA" -H "Cache-Control: no-cache" \
              "$WORKER_URL/?hc=$(date +%s)$RANDOM$RANDOM")
            SIZE=$(echo -n "$HTML" | wc -c)
            HAS_ADS=$(echo "$HTML" | grep -c "ca-pub-" || true)
            HAS_GOOD_CANONICAL=$(echo "$HTML" | grep -c "automatizacionslatam.com" || true)
            echo "  Worker: ${SIZE} bytes, ca-pub matches: ${HAS_ADS}, canonical-ok matches: ${HAS_GOOD_CANONICAL}"
            if [ "$HAS_ADS" -gt 0 ] && [ "$HAS_GOOD_CANONICAL" -gt 0 ]; then
              echo "::notice::Healthcheck OK — el Worker sirve AdSense + canonical correcto (intento $attempt)."
              PUB=$(curl -s -A "$UA" "$PUBLIC_URL/?hc=$(date +%s)$RANDOM" | grep -c "ca-pub-" || true)
              if [ "$PUB" -gt 0 ]; then
                echo "::notice::Custom domain tambien sirve AdSense."
              else
                echo "::warning::Custom domain todavia sirve cache anterior. Se propaga solo en <10 min."
              fi
              exit 0
            fi
            echo "::warning::Intento $attempt: el Worker no muestra ca-pub- o canonical. Reintentando en 20s..."
            sleep 20
          done
          echo "::error::Healthcheck FALLO. El Worker NO sirve AdSense despues del deploy."
          echo "::error::Revisar: 1) PUBLIC_ADSENSE_CLIENT en Secrets, 2) integracion Git CF aun activa, 3) astro.config.mjs SITE_URL default."
          exit 1
